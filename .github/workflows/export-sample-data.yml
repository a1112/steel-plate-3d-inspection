name: Export sample data

on:
  push:
    branches:
      - agent/export-sample-data
    paths:
      - .github/workflows/export-sample-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build migration inventory
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path("sample-data")
          files = []
          total = 0
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              size = path.stat().st_size
              total += size
              files.append({
                  "path": path.relative_to(root).as_posix(),
                  "size": size,
                  "sha256": digest.hexdigest(),
              })

          inventory = {
              "schemaVersion": 1,
              "sourceRepository": "a1112/steel-plate-3d-inspection",
              "sourceCommit": "${{ github.sha }}",
              "fileCount": len(files),
              "totalBytes": total,
              "files": files,
          }
          Path("sample-data-migration-inventory.json").write_text(
              json.dumps(inventory, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Upload private migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-inspection-sample-data
          path: |
            sample-data
            sample-data-migration-inventory.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Record export run
        shell: bash
        run: |
          mkdir -p .migration
          printf '%s\n' "${{ github.run_id }}" > .migration/export-run-id.txt
          cp sample-data-migration-inventory.json .migration/inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .migration/export-run-id.txt .migration/inventory.json
          git commit -m "chore: record sample data export [skip ci]"
          git push origin HEAD:agent/export-sample-data
