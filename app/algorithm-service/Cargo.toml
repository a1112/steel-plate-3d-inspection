[package]
name = "steel-algorithm-service"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sea-orm = { version = "1.1", features = ["sqlx-mysql", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
steel-inspection-result-contract = { path = "../result-contract" }
