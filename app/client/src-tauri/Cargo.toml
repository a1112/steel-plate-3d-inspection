[package]
name = "steel-plate-3d-inspection-tauri"
version = "0.1.0"
description = "Bar Surface 3D Reconstruction desktop shell"
authors = ["codex"]
edition = "2021"

[lib]
name = "steel_plate_3d_inspection_tauri_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
