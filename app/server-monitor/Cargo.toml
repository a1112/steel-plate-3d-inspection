[package]
name = "steel-inspection-server-monitor"
version = "0.1.0"
description = "Independent server-side task monitor and system tray"
authors = ["北科工研"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug-assertions = false
strip = "symbols"
