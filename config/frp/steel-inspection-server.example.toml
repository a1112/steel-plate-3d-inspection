# Copy this file to a deployment-local *.local.toml file before editing it.
# Never commit the real FRP username or password.

serverAddr = "frp-gz.zjz-service.cn"
serverPort = 7000
user = "REPLACE_WITH_FRP_USER"
loginFailExit = true

transport.protocol = "tcp"
# Pre-create the hosted server's default maximum number of work connections so
# the first browser/image request does not wait for a new FRP work connection.
transport.poolCount = 5
transport.tls.enable = true

[metadatas]
password = "REPLACE_WITH_FRP_PASSWORD"

[[proxies]]
# Keep this name distinct from the development-machine proxy named https_test.
name = "steel_inspection_server"
type = "http"
localIP = "127.0.0.1"
localPort = 4873
customDomains = ["kacg6rxr.zjz-service.cn"]

[proxies.transport]
# Image responses are already encoded; another compression layer reduces throughput.
useEncryption = false
useCompression = false

[proxies.healthCheck]
type = "http"
path = "/api/health/live"
intervalSeconds = 10
timeoutSeconds = 3
maxFailed = 3
