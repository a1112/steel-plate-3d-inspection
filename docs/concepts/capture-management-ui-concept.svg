<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">采集管理独立应用界面概念图</title>
  <desc id="desc">展示采集管理软件从配置创建、应用配置到相机状态总览、单相机详情、日志与控制 API 的界面结构。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f7"/>
      <stop offset="0.48" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#e9eef3"/>
    </linearGradient>
    <linearGradient id="appChrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102339"/>
      <stop offset="1" stop-color="#244259"/>
    </linearGradient>
    <linearGradient id="panelTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173044" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: url(#pageBg); }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #263542; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .muted { fill: #71808f; }
      .caption { fill: #4d5f70; font-size: 20px; font-weight: 600; }
      .title { fill: #162433; font-size: 44px; font-weight: 800; }
      .subtitle { fill: #526473; font-size: 22px; }
      .chromeText { fill: #edf6ff; }
      .chromeSub { fill: #a9bfce; }
      .panel { fill: url(#panelTint); stroke: #d7e0e8; stroke-width: 1.4; }
      .line { stroke: #d7e0e8; stroke-width: 1.4; }
      .strongLine { stroke: #8aa0b3; stroke-width: 2; }
      .chip { fill: #edf4f8; stroke: #d2dde6; }
      .chipOn { fill: #e6f4ee; stroke: #8cc8ad; }
      .chipWarn { fill: #fff3dd; stroke: #e8bd69; }
      .chipBad { fill: #ffe9e5; stroke: #e0968c; }
      .success { fill: #24a370; }
      .warning { fill: #e19a23; }
      .danger { fill: #c64b3a; }
      .info { fill: #2878bd; }
      .idle { fill: #8392a0; }
      .btn { fill: #244b66; }
      .btnAlt { fill: #edf4f8; stroke: #cbd8e2; }
      .screen { fill: #ffffff; stroke: #cbd8e2; stroke-width: 1.5; }
      .module { fill: #f7fafc; stroke: #d6e0e8; stroke-width: 1.2; }
      .flow { fill: #ffffff; stroke: #bfcdd8; stroke-width: 1.5; }
      .flowText { font-size: 17px; font-weight: 700; fill: #233447; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 15px; fill: #34495a; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1180"/>

  <g class="label">
    <text class="title" x="88" y="84">采集管理独立应用 UI 概念图</text>
    <text class="subtitle" x="90" y="122">主界面以相机状态总览为核心，配置驱动采集；点击相机进入独立详情页，终端页保持轻量或内嵌真实管理界面。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="82" y="170" width="1008" height="760" rx="18" fill="#ffffff"/>
    <rect x="82" y="170" width="1008" height="72" rx="18" fill="url(#appChrome)"/>
    <rect x="82" y="224" width="1008" height="706" fill="#ffffff"/>

    <g class="label">
      <circle cx="122" cy="206" r="8" fill="#ff6b5d"/>
      <circle cx="148" cy="206" r="8" fill="#f5bd3f"/>
      <circle cx="174" cy="206" r="8" fill="#36c16f"/>
      <text class="chromeText" x="214" y="214" font-size="24" font-weight="800">采集管理中心</text>
      <text class="chromeSub" x="380" y="214" font-size="16">独立桌面应用 / Tauri 驱动集成</text>
      <rect x="852" y="190" width="96" height="32" rx="16" fill="#2e5873"/>
      <text class="chromeText tiny" x="876" y="212">在线</text>
      <rect x="962" y="190" width="90" height="32" rx="16" fill="#193249"/>
      <text class="chromeText tiny" x="986" y="212">日志</text>
    </g>

    <rect x="112" y="266" width="948" height="88" rx="14" class="panel"/>
    <g class="label">
      <text class="caption" x="138" y="300">配置驱动</text>
      <rect x="138" y="316" width="170" height="24" rx="12" class="chipOn"/>
      <text class="tiny" x="154" y="334">生产线 A / 8 相机</text>
      <rect x="330" y="316" width="142" height="24" rx="12" class="chip"/>
      <text class="tiny muted" x="346" y="334">曝光 4500 μs</text>
      <rect x="492" y="316" width="160" height="24" rx="12" class="chip"/>
      <text class="tiny muted" x="508" y="334">触发: 编码器</text>
      <rect x="680" y="296" width="126" height="38" rx="8" class="btnAlt"/>
      <text class="small" x="704" y="321">编辑配置</text>
      <rect x="822" y="296" width="130" height="38" rx="8" class="btn"/>
      <text class="small chromeText" x="846" y="321">应用配置</text>
      <rect x="966" y="296" width="64" height="38" rx="8" class="btnAlt"/>
      <text class="small" x="987" y="321">刷新</text>
    </g>

    <g class="label">
      <rect x="112" y="378" width="218" height="112" rx="12" class="module"/>
      <text class="tiny muted" x="138" y="410">服务状态</text>
      <text x="138" y="450" font-size="34" font-weight="800" fill="#1f8f67">运行中</text>
      <circle cx="294" cy="424" r="13" class="success"/>
      <text class="tiny muted" x="138" y="476">采集服务 127.0.0.1:4317</text>

      <rect x="350" y="378" width="218" height="112" rx="12" class="module"/>
      <text class="tiny muted" x="376" y="410">相机在线</text>
      <text x="376" y="450" font-size="34" font-weight="800">7 / 8</text>
      <text class="tiny warning" x="476" y="449">1 台告警</text>
      <text class="tiny muted" x="376" y="476">GigE / USB3 混合接入</text>

      <rect x="588" y="378" width="218" height="112" rx="12" class="module"/>
      <text class="tiny muted" x="614" y="410">当前吞吐</text>
      <text x="614" y="450" font-size="34" font-weight="800">1.28 GB/s</text>
      <text class="tiny muted" x="614" y="476">平均延迟 16.4 ms</text>

      <rect x="826" y="378" width="234" height="112" rx="12" class="module"/>
      <text class="tiny muted" x="852" y="410">API 暴露</text>
      <text x="852" y="450" font-size="34" font-weight="800">42</text>
      <text class="tiny muted" x="912" y="449">项获取与控制接口</text>
      <text class="tiny muted" x="852" y="476">REST + Tauri command</text>
    </g>

    <g class="label">
      <text class="caption" x="112" y="530">相机状态总览</text>
      <text class="tiny muted" x="250" y="530">点击卡片进入单相机详情</text>

      <g transform="translate(112 552)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-01 上表面</text>
        <text class="tiny muted" x="22" y="66">30 FPS · 1920×1200</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">采集中</text>
        <text class="tiny muted" x="116" y="96">12.6 ms</text>
      </g>
      <g transform="translate(350 552)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-02 上表面</text>
        <text class="tiny muted" x="22" y="66">30 FPS · 1920×1200</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">采集中</text>
        <text class="tiny muted" x="116" y="96">14.1 ms</text>
      </g>
      <g transform="translate(588 552)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="warning"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-03 边缘</text>
        <text class="tiny muted" x="22" y="66">27 FPS · 丢帧 0.8%</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#fff3dd"/>
        <text class="tiny warning" x="34" y="96">告警</text>
        <text class="tiny muted" x="116" y="96">需复位</text>
      </g>
      <g transform="translate(826 552)">
        <rect width="234" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-04 边缘</text>
        <text class="tiny muted" x="22" y="66">30 FPS · 1920×1200</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">采集中</text>
        <text class="tiny muted" x="116" y="96">13.3 ms</text>
      </g>

      <g transform="translate(112 690)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-05 下表面</text>
        <text class="tiny muted" x="22" y="66">30 FPS · 1920×1200</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">采集中</text>
        <text class="tiny muted" x="116" y="96">15.0 ms</text>
      </g>
      <g transform="translate(350 690)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-06 下表面</text>
        <text class="tiny muted" x="22" y="66">30 FPS · 1920×1200</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">采集中</text>
        <text class="tiny muted" x="116" y="96">13.8 ms</text>
      </g>
      <g transform="translate(588 690)">
        <rect width="222" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="idle"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-07 备用</text>
        <text class="tiny muted" x="22" y="66">0 FPS · 待机</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#edf4f8"/>
        <text class="tiny muted" x="34" y="96">待机</text>
        <text class="tiny muted" x="116" y="96">可启用</text>
      </g>
      <g transform="translate(826 690)">
        <rect width="234" height="116" rx="12" class="screen"/>
        <circle cx="28" cy="28" r="9" class="success"/>
        <text x="48" y="34" font-size="18" font-weight="800">CAM-08 标定</text>
        <text class="tiny muted" x="22" y="66">15 FPS · 标定模式</text>
        <rect x="22" y="82" width="70" height="18" rx="9" fill="#e6f4ee"/>
        <text class="tiny success" x="34" y="96">在线</text>
        <text class="tiny muted" x="116" y="96">参数锁定</text>
      </g>
    </g>

    <g class="label">
      <rect x="112" y="835" width="466" height="68" rx="12" class="module"/>
      <text class="caption" x="136" y="862">终端界面策略</text>
      <text class="tiny muted" x="136" y="887">终端页只保留轻量状态；需要完整管理时打开独立应用，或以内嵌真实管理界面呈现。</text>
      <rect x="606" y="835" width="454" height="68" rx="12" class="module"/>
      <text class="caption" x="630" y="862">日志与控制</text>
      <text class="tiny muted" x="630" y="887">关键告警、操作记录、采集批次和 API 调用结果进入统一日志流。</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="170" width="388" height="760" rx="18" fill="#ffffff"/>
    <rect x="1130" y="170" width="388" height="72" rx="18" fill="url(#appChrome)"/>
    <rect x="1130" y="224" width="388" height="706" fill="#ffffff"/>
    <g class="label">
      <text class="chromeText" x="1160" y="214" font-size="23" font-weight="800">单相机详情</text>
      <text class="chromeSub" x="1295" y="214" font-size="15">CAM-03</text>

      <rect x="1160" y="270" width="328" height="178" rx="14" fill="#12283a"/>
      <rect x="1182" y="292" width="284" height="112" rx="8" fill="#213c51"/>
      <path d="M1182 376 C1230 330, 1276 390, 1322 346 S1418 356,1466 318 L1466 404 L1182 404 Z" fill="#5f879c" opacity="0.65"/>
      <path d="M1182 394 C1238 360, 1280 414, 1335 378 S1420 386,1466 354 L1466 404 L1182 404 Z" fill="#91b1bf" opacity="0.82"/>
      <text class="tiny chromeSub" x="1182" y="428">实时预览 / 深度图 / 最后一帧</text>

      <rect x="1160" y="472" width="328" height="100" rx="12" class="module"/>
      <text class="caption" x="1184" y="502">状态诊断</text>
      <circle cx="1192" cy="532" r="8" class="warning"/>
      <text class="tiny" x="1210" y="537">丢帧率 0.8%，建议复位触发链路</text>
      <text class="tiny muted" x="1184" y="558">温度 43.2°C · 延迟 18.6 ms · 队列 12</text>

      <rect x="1160" y="594" width="328" height="134" rx="12" class="module"/>
      <text class="caption" x="1184" y="624">参数与控制</text>
      <text class="tiny muted" x="1184" y="654">曝光</text>
      <rect x="1234" y="640" width="170" height="8" rx="4" fill="#d7e1e9"/>
      <rect x="1234" y="640" width="112" height="8" rx="4" fill="#2878bd"/>
      <text class="tiny" x="1414" y="654">4500</text>
      <rect x="1184" y="678" width="74" height="32" rx="8" class="btn"/>
      <text class="tiny chromeText" x="1208" y="699">启动</text>
      <rect x="1272" y="678" width="74" height="32" rx="8" class="btnAlt"/>
      <text class="tiny" x="1296" y="699">停止</text>
      <rect x="1360" y="678" width="90" height="32" rx="8" class="btnAlt"/>
      <text class="tiny" x="1384" y="699">软触发</text>

      <rect x="1160" y="750" width="328" height="146" rx="12" class="module"/>
      <text class="caption" x="1184" y="780">接口与日志</text>
      <text class="mono" x="1184" y="812">GET /cameras/CAM-03/status</text>
      <text class="mono" x="1184" y="840">POST /cameras/CAM-03/reset</text>
      <text class="mono" x="1184" y="868">TAURI: set_camera_exposure</text>
    </g>
  </g>

  <g class="label">
    <path d="M1060 610 C1094 610, 1096 610, 1130 610" fill="none" class="strongLine"/>
    <path d="M1118 600 L1130 610 L1118 620" fill="none" class="strongLine"/>
    <rect x="1036" y="580" width="142" height="34" rx="17" fill="#ffffff" stroke="#bfcdd8"/>
    <text class="tiny" x="1055" y="602">点击相机卡片</text>
  </g>

  <g class="label" transform="translate(90 984)">
    <text class="caption" x="0" y="0">配置到采集的界面流程</text>
    <g transform="translate(0 32)">
      <rect class="flow" x="0" y="0" width="186" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">创建配置</text>
      <text class="tiny muted" x="28" y="58">设备 / 触发 / 曝光</text>
    </g>
    <g transform="translate(226 32)">
      <rect class="flow" x="0" y="0" width="186" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">应用配置</text>
      <text class="tiny muted" x="28" y="58">校验后写入驱动</text>
    </g>
    <g transform="translate(452 32)">
      <rect class="flow" x="0" y="0" width="186" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">启动服务</text>
      <text class="tiny muted" x="28" y="58">Rust/Tauri 管理进程</text>
    </g>
    <g transform="translate(678 32)">
      <rect class="flow" x="0" y="0" width="186" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">状态总览</text>
      <text class="tiny muted" x="28" y="58">多相机在线监控</text>
    </g>
    <g transform="translate(904 32)">
      <rect class="flow" x="0" y="0" width="186" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">相机详情</text>
      <text class="tiny muted" x="28" y="58">参数 / 图像 / 诊断</text>
    </g>
    <g transform="translate(1130 32)">
      <rect class="flow" x="0" y="0" width="270" height="78" rx="12"/>
      <text class="flowText" x="28" y="32">控制 API 与日志</text>
      <text class="tiny muted" x="28" y="58">获取状态、控制采集、追踪操作</text>
    </g>
    <path d="M186 71 H226 M412 71 H452 M638 71 H678 M864 71 H904 M1090 71 H1130" fill="none" stroke="#8aa0b3" stroke-width="2"/>
  </g>
</svg>
